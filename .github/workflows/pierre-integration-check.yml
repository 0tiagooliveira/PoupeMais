name: Pierre bridge checks
on:
  push:
    branches:
      - feature/pierre-financial-sync-20261025
  pull_request:
    paths:
      - 'worker/**'
      - 'features/settings/PierreIntegrationPage.tsx'
      - 'features/settings/SettingsPage.tsx'
      - 'App.tsx'
      - 'firebase.json'
      - 'package.json'
      - 'package-lock.json'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Build app
        run: npm run build
      - name: Check Worker syntax
        run: node --check worker/src/index.js
      - name: Check Cloud Shell deploy script
        run: bash -n scripts/deploy-pierre-hosting.sh
      - name: Install Worker dependencies
        run: npm install --prefix worker --no-audit --no-fund
